name: Generate missing summaries
on:
  workflow_dispatch:
    inputs:
      posts:
        description: 'Space-separated content file paths, or "all" to scan posts/education/useful for anything missing a summary'
        required: false
        default: "all"
        type: string
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --quiet pyyaml requests requests_oauthlib google-genai

      - name: Resolve target files
        id: added
        run: |
          input="${{ inputs.posts }}"
          if [ -z "$input" ] || [ "$input" = "all" ]; then
            files=$(python3 scripts/social_post.py find-missing content/posts content/education content/useful)
          else
            files="$input"
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Rebase gemini-summaries branch onto latest main
        if: steps.added.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gemini-summaries > /dev/null; then
            git checkout -B gemini-summaries origin/gemini-summaries
            git merge --no-edit origin/main
          else
            git checkout -B gemini-summaries origin/main
          fi

      - name: Generate summaries
        if: steps.added.outputs.files != ''
        run: python3 scripts/social_post.py generate ${{ steps.added.outputs.files }}

      - name: Commit and push
        if: steps.added.outputs.files != ''
        run: |
          git add content
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: add Gemini-generated summaries"
          git push origin gemini-summaries
