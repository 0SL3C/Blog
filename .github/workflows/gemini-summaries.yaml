name: Generate missing summaries
on:
  push:
    branches: [main]
    paths:
      - "content/**.md"
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find every post without a summary
        id: added
        run: |
          missing=""
          for f in $(find content/posts content/education content/useful -name '*.md' 2>/dev/null); do
            if ! grep -q '^summary:' "$f"; then
              missing="$missing $f"
            fi
          done
          echo "files=$missing" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.added.outputs.files != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.added.outputs.files != ''
        run: pip install --quiet pyyaml requests requests_oauthlib google-genai

      - name: Rebase gemini-summaries branch onto latest main
        if: steps.added.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gemini-summaries > /dev/null; then
            git checkout -B gemini-summaries origin/gemini-summaries
            git merge --no-edit origin/main
          else
            git checkout -B gemini-summaries origin/main
          fi

      - name: Generate summaries
        if: steps.added.outputs.files != ''
        run: python3 scripts/social_post.py generate ${{ steps.added.outputs.files }}

      - name: Commit and push
        if: steps.added.outputs.files != ''
        run: |
          git add content
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: add Gemini-generated summaries"
          git push origin gemini-summaries
